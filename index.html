<script>
  var _carouselLightboxOpen = false;
  function openCarouselLightbox(src) {
    if (_carouselLightboxOpen) return;
    _carouselLightboxOpen = true;
    var lb = document.getElementById('carousel-lightbox');
    var img = document.getElementById('carousel-lightbox-img');
    img.src = src;
    img.style.borderRadius = '15px';  
    lb.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    document.body.classList.add('carousel-lightbox-open');  
  }
  function closeCarouselLightbox() {
    document.getElementById('carousel-lightbox').style.display = 'none';
    document.body.style.overflow = '';
    document.body.classList.remove('carousel-lightbox-open');
    setTimeout(function () { _carouselLightboxOpen = false; }, 100);
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeCarouselLightbox();
  });
</script>
